<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 설치 없는 웹 뷰어(itda-work/itda-hyve#577 2b). 그리기는 공유 화면(share.html)과 같은 share.js 이고 View 원천만 다르다 — viewer.js 가
     share.js 앞에서 window.ItdaViewSource(wasm 으로 그린 View)를 둔다. body 에 data-base 가 없어야 한다(있으면 share.js 가 공유 서버 원천을 쓴다).
     아래 id 들(doc-title·look-switch·notes-switch·sidebar·side-toc·toc-back·viewer·pages-box·pages·ended·load-err·follow-back·table-ctx·toast·stage)은
     share.js 가 찾는 자리다 — share.html 과 같게 둔다.
     CSP 는 공유 화면처럼 default-src 'none' 에 쓰는 것만 연다. 제3자 출처로 가는 요청(connect·그림·글꼴·스크립트·스타일)은 막는다.
     그림(img-src)은 data:·blob: 만 열어 같은 출처(뷰어를 낸 서버)로 가는 그림 요청도 막는다 — 상대 경로 그림의 파일 이름이 서버로 가지
     않게(viewer.js localImages·folderImages 가 src 를 먼저 옮기고, 놓친 것은 CSP 가 막는다). 폴더로 열면 그 폴더의 그림은 blob: URL 로
     그린다(브라우저 안의 파일 — 요청이 아니다). 원격 그림도 막힌다(img-src 에 https: 없음). 같은 출처로
     가는 다른 요청(connect·스크립트·글꼴)은 막지 않으므로, 같은 출처에 원문을 보내지 않는 것은 코드가 지킨다.
     링크 이동은 CSP 가 막지 않는다 — 문서 안 상대 링크(#조각·http(s)·mailto·tel 이 아닌 href)는 viewer.js localLinks 가 href 를
     data-local-href 로 옮겨 같은 출처로 이동하지 않게 한다(가운데 단추·새 탭도). 테마 CSS 와 인쇄 쪽 크기(@page)는 viewer.js 가 blob: URL 의
     <link> 로 넣으므로 style-src 에 인라인을 열지 않는다 — 문서 HTML 의 style 속성(mdoc 의 width 등)은 공유 화면(style-src 'self')처럼 막힌다
     (pager.js adoptWidths 가 data-w 로 옮겨 건다). frame-ancestors 는 meta 로 걸 수 없다(정적 서버의 응답 머리 몫). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' blob:; img-src data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="application-name" content="itda-doc 뷰어">
<title>itda-doc 뷰어</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="share.css">
<link rel="stylesheet" id="viewer-theme">
<script src="wasm_exec.js" defer></script>
<script src="temml.min.js" defer></script>
<script src="itda-doc.js" defer></script>
<script src="pager.js" defer></script>
<script src="slides.js" defer></script>
<script src="viewer.js" defer></script>
<script src="share.js" defer></script>
</head>
<body class="share-view itda-viewer paper-a4">
<!-- 아이콘은 Lucide 모양을 참고해 다시 그린 것(ISC — LICENSE-Lucide.txt) -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></symbol>
  <symbol id="i-csv" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 12h8v6H8zM8 15h8M12 12v6"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></symbol>
</svg>
<header class="bar share-bar">
  <button class="ibtn" id="btn-toc" title="목차 보기·숨기기" aria-label="목차" aria-controls="sidebar" aria-expanded="false" hidden><svg class="ic" aria-hidden="true"><use href="#i-sidebar"/></svg></button>
  <div class="doc-name"><span id="doc-title">뷰어를 올리는 중…</span></div>
  <div class="spacer"></div>
  <div class="viewer-tools">
    <button class="btn" id="btn-open" title="md 파일 열기(이 브라우저 안에서만 읽는다)">열기</button>
    <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
    <button class="btn" id="btn-folder" title="문서 폴더 열기 — 폴더 설정(_metadata.yml)과 상대 경로 그림을 쓴다(이 브라우저 안에서만 읽는다)">폴더</button>
    <input type="file" id="dir" webkitdirectory hidden>
    <select id="doc-pick" class="vsel" title="폴더 안의 문서" aria-label="폴더 안의 문서" hidden></select>
    <button class="btn" id="btn-paste" title="원문 붙여넣기">붙여넣기</button>
    <select id="sample" class="vsel" title="견본 열기" aria-label="견본"><option value="">견본…</option></select>
    <select id="theme" class="vsel" title="테마(이 화면에서만)" aria-label="테마"><option value="">문서의 테마</option></select>
  </div>
  <!-- 발표자 노트: 노트가 있는 슬라이드 보기에서만 보인다(share.js paintNotesSwitch) -->
  <div class="group notes-switch" id="notes-switch" role="group" aria-label="발표자 노트" hidden>
    <span class="notes-k">노트</span>
    <button class="gbtn" data-notes="off" title="노트 끔">끔</button>
    <button class="gbtn" data-notes="right" title="노트를 슬라이드 오른쪽에(좁은 화면에서는 아래에)">오른쪽</button>
    <button class="gbtn" data-notes="below" title="노트를 슬라이드 아래에">아래</button>
    <span class="note-fs" role="group" aria-label="노트 글자 크기 — 이 화면에서만">
      <button class="gbtn" data-note-font="-1" title="노트 글자 작게" aria-label="노트 글자 작게">A−</button>
      <span class="note-fs-val" id="note-fs-val" title="노트 글자 크기(px)">14</span>
      <button class="gbtn" data-note-font="1" title="노트 글자 크게" aria-label="노트 글자 크게">A+</button>
    </span>
  </div>
  <div class="group" id="look-switch" role="group" aria-label="보기 꼴" hidden>
    <button class="gbtn" data-look="doc" title="쪽 — A4 로 나눠 보기">쪽</button>
    <button class="gbtn" data-look="flow" title="이어보기 — 쪽 나눔 없이">이어보기</button>
    <button class="gbtn" data-look="slides" title="슬라이드 — 제목으로 나눠 보기">슬라이드</button>
  </div>
  <span class="open-state" id="open-state" hidden></span>
  <button class="btn warn-btn" id="btn-warn" title="경고 목록" aria-controls="warn-panel" aria-expanded="false" hidden>경고 <span id="warn-count">0</span></button>
  <button class="btn" id="btn-print" title="브라우저 인쇄(PDF 로 저장 포함)">인쇄</button>
</header>
<div class="main">
  <aside id="sidebar" class="sidebar" aria-label="목차" hidden>
    <div class="side-title">목차</div>
    <nav id="side-toc"></nav>
  </aside>
  <div id="toc-back" class="toc-back" hidden></div>
  <div id="viewer" class="viewer">
    <div id="pages-box" class="pages-box"><div id="pages" class="pages"></div></div>
    <div id="viewer-empty" class="viewer-empty">
      <div class="viewer-empty-card">
        <h2>itda-doc 뷰어</h2>
        <p>md 파일이나 문서 폴더를 여기에 끌어 놓거나 「열기」·「폴더」·「붙여넣기」·「견본」으로 엽니다. 폴더로 열면 폴더 설정(_metadata.yml)과 상대 경로 그림이 적용됩니다. 문서는 이 브라우저 안에서만 그려지고 어디로도 보내지 않습니다.</p>
      </div>
    </div>
    <div id="ended" class="share-ended" hidden>
      <div class="share-ended-card">
        <h2 id="ended-title">끝났습니다</h2>
        <p id="ended-msg"></p>
      </div>
    </div>
    <p id="load-err" class="share-err" hidden></p>
  </div>
  <aside id="warn-panel" class="warn-panel" aria-label="경고" hidden>
    <div class="warn-head"><span>경고</span><button class="ibtn" id="warn-close" title="닫기" aria-label="경고 닫기">×</button></div>
    <ol id="warn-list"></ol>
  </aside>
  <button type="button" id="follow-back" class="follow-back" hidden>발표자 위치로</button>
</div>
<div class="menu" id="table-ctx" role="menu" aria-label="표 복사" hidden>
  <button type="button" data-table-copy="tsv" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-table"/></svg><span>표 복사</span></button>
  <button type="button" data-table-copy="csv" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-csv"/></svg><span>CSV로 복사</span></button>
  <button type="button" data-table-copy="md" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-code"/></svg><span>Markdown으로 복사</span></button>
</div>
<dialog id="paste-dlg" class="paste-dlg" aria-label="원문 붙여넣기">
  <textarea id="paste-text" spellcheck="false" placeholder="md 원문을 붙여 넣으세요"></textarea>
  <div class="paste-row"><button class="btn" id="paste-cancel" type="button">취소</button><button class="btn primary" id="paste-ok" type="button">그리기</button></div>
</dialog>
<div class="toast" id="toast" hidden></div>
<div id="stage" class="stage pages" aria-hidden="true"></div>
</body>
</html>
